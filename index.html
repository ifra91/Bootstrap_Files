<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Tutorial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

<style>
    .slider{
        width:100%;
        height: 500px;
    }
</style>

</head>
<body class="p-2 theme-primary theme-subtle">
    <header>
        <div class="container-fluid">
            <nav class="navbar sm:navbar-expand bg-1 fg-2">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                    </ul>
                </div>
                </dialog>
            </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container-fluid">
            <div id="carouselStacked" class="carousel slide">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Top controls</h5>
                <div>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStacked" data-bs-slide="prev">
                    <span class="carousel-icon-prev" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStacked" data-bs-slide="next">
                    <span class="carousel-icon-next" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
                </div>
            </div>
            <div class="carousel-inner rounded-5">
                <div class="carousel-item active">
                <img src="https://png.pngtree.com/thumb_back/fh260/background/20230702/pngtree-vibrant-geometric-design-a-3d-render-perfect-for-website-sliders-and-image_3744278.jpg" class="d-block w-100 slider" alt="color-ribbon">
                </div>
                <div class="carousel-item">
                <img src="https://www.sliderrevolution.com/wp-content/uploads/2023/06/what-is-a-slider.jpg" class="d-block w-100 slider" alt="image of astronaut">
                </div>
                <div class="carousel-item">
                <img src="https://cdn.searchenginejournal.com/wp-content/uploads/2022/05/website-slider-62740d22c631f-sej.png" class="d-block w-100 slider" alt="office Image">
                </div>
            </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer">

        </div>
    </footer>
    
</body>
</html>
